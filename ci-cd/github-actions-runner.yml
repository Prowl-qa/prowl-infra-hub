# GitHub Actions Self-Hosted Runner
# Installs and configures a self-hosted GitHub Actions runner on Debian-based hosts
#
# Customize:
#   - INVENTORY_GROUP: Target host group for runner installation
#   - RUNNER_USER: System user to run the GitHub Actions runner service
#   - GITHUB_ORG: GitHub organization that owns the repository
#   - GITHUB_REPO: Repository to register the runner against
#   - RUNNER_TOKEN: Registration token obtained from GitHub Settings > Actions > Runners
#   - RUNNER_LABELS: Comma-separated labels to assign to the runner

name: github-actions-runner
description: Installs and configures a self-hosted GitHub Actions runner
tags: [ci-cd, github-actions, runner, self-hosted]
tool: ansible
cloud_provider: agnostic
os_family: debian
risk_level: low
compliance_tags: []

vars:
  INVENTORY_GROUP: "{{INVENTORY_GROUP}}"
  RUNNER_USER: "{{RUNNER_USER}}"
  GITHUB_ORG: "{{GITHUB_ORG}}"
  GITHUB_REPO: "{{GITHUB_REPO}}"
  RUNNER_TOKEN: "{{RUNNER_TOKEN}}"
  RUNNER_LABELS: "{{RUNNER_LABELS}}"

playbook: |
  ---
  - name: Install and configure GitHub Actions self-hosted runner
    hosts: "{{INVENTORY_GROUP}}"
    become: true
    vars:
      runner_version: "2.319.1"
      runner_archive: "actions-runner-linux-x64-{{ runner_version }}.tar.gz"
      runner_home: "/home/{{RUNNER_USER}}/actions-runner"

    tasks:
      - name: Create runner user
        ansible.builtin.user:
          name: "{{RUNNER_USER}}"
          shell: /bin/bash
          create_home: true
          system: false
          state: present

      - name: Install required dependencies
        ansible.builtin.apt:
          name:
            - curl
            - jq
            - libicu-dev
          state: present
          update_cache: true

      - name: Create runner directory
        ansible.builtin.file:
          path: "{{ runner_home }}"
          state: directory
          owner: "{{RUNNER_USER}}"
          group: "{{RUNNER_USER}}"
          mode: "0755"

      - name: Download GitHub Actions runner
        ansible.builtin.get_url:
          url: "https://github.com/actions/runner/releases/download/v{{ runner_version }}/{{ runner_archive }}"
          dest: "/tmp/{{ runner_archive }}"
          mode: "0644"

      - name: Extract runner archive
        ansible.builtin.unarchive:
          src: "/tmp/{{ runner_archive }}"
          dest: "{{ runner_home }}"
          remote_src: true
          owner: "{{RUNNER_USER}}"
          group: "{{RUNNER_USER}}"

      - name: Configure the runner
        ansible.builtin.command:
          cmd: >
            ./config.sh
            --url https://github.com/{{GITHUB_ORG}}/{{GITHUB_REPO}}
            --token {{RUNNER_TOKEN}}
            --labels {{RUNNER_LABELS}}
            --unattended
            --replace
          chdir: "{{ runner_home }}"
        become_user: "{{RUNNER_USER}}"

      - name: Install runner as a service
        ansible.builtin.command:
          cmd: ./svc.sh install {{RUNNER_USER}}
          chdir: "{{ runner_home }}"

      - name: Start the runner service
        ansible.builtin.command:
          cmd: ./svc.sh start
          chdir: "{{ runner_home }}"
