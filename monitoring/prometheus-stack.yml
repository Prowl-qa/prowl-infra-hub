# Prometheus + Grafana Monitoring Stack
# Deploy a complete monitoring stack with Prometheus, Grafana, and Alertmanager using Docker Compose
#
# Customize:
#   - PROMETHEUS_PORT: Host port for Prometheus UI (default: 9090)
#   - GRAFANA_PORT: Host port for Grafana UI (default: 3000)
#   - GRAFANA_ADMIN_PASSWORD: Admin password for Grafana dashboard
#   - RETENTION_DAYS: Number of days to retain Prometheus metrics data

name: prometheus-stack
description: Docker Compose deployment for Prometheus, Grafana, and Alertmanager monitoring stack
tags: [monitoring, prometheus, grafana, alertmanager, docker-compose, observability]
tool: docker-compose
cloud_provider: agnostic
os_family: agnostic
risk_level: low
compliance_tags: []

vars:
  PROMETHEUS_PORT: "{{PROMETHEUS_PORT}}"
  GRAFANA_PORT: "{{GRAFANA_PORT}}"
  GRAFANA_ADMIN_PASSWORD: "{{GRAFANA_ADMIN_PASSWORD}}"
  RETENTION_DAYS: "{{RETENTION_DAYS}}"

playbook: |
  ---
  version: "3.8"

  services:
    prometheus:
      image: prom/prometheus:latest
      container_name: prometheus
      restart: unless-stopped
      ports:
        - "{{PROMETHEUS_PORT}}:9090"
      volumes:
        - prometheus_data:/prometheus
        - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
        - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      command:
        - "--config.file=/etc/prometheus/prometheus.yml"
        - "--storage.tsdb.path=/prometheus"
        - "--storage.tsdb.retention.time={{RETENTION_DAYS}}d"
        - "--web.console.libraries=/etc/prometheus/console_libraries"
        - "--web.console.templates=/etc/prometheus/consoles"
        - "--web.enable-lifecycle"
      networks:
        - monitoring

    grafana:
      image: grafana/grafana:latest
      container_name: grafana
      restart: unless-stopped
      ports:
        - "{{GRAFANA_PORT}}:3000"
      volumes:
        - grafana_data:/var/lib/grafana
        - ./grafana/provisioning:/etc/grafana/provisioning:ro
      environment:
        - GF_SECURITY_ADMIN_PASSWORD={{GRAFANA_ADMIN_PASSWORD}}
        - GF_USERS_ALLOW_SIGN_UP=false
      depends_on:
        - prometheus
      networks:
        - monitoring

    alertmanager:
      image: prom/alertmanager:latest
      container_name: alertmanager
      restart: unless-stopped
      ports:
        - "9093:9093"
      volumes:
        - alertmanager_data:/alertmanager
        - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      command:
        - "--config.file=/etc/alertmanager/alertmanager.yml"
        - "--storage.path=/alertmanager"
      networks:
        - monitoring

  volumes:
    prometheus_data:
    grafana_data:
    alertmanager_data:

  networks:
    monitoring:
      driver: bridge
