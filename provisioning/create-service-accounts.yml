# Create Service Accounts
# Creates application-specific service accounts with limited privileges,
# dedicated home directories, and no interactive login shell.
#
# Customize:
#   - Set INVENTORY_GROUP to target hosts
#   - Set SERVICE_ACCOUNTS as a comma-separated list of account names
#   - Set APP_BASE_DIR for the parent directory of service account homes

name: create-service-accounts
description: Create application service accounts with limited privileges
tags: [provisioning, linux, users, security, service-accounts]
tool: ansible
cloud_provider: agnostic
os_family: agnostic
risk_level: low
compliance_tags: [SOC2]

vars:
  INVENTORY_GROUP: "{{INVENTORY_GROUP}}"
  SERVICE_ACCOUNTS: "{{SERVICE_ACCOUNTS}}"
  APP_BASE_DIR: "{{APP_BASE_DIR}}"

playbook: |
  ---
  - hosts: "{{ inventory_group }}"
    become: true
    tasks:
      - name: Create application base directory
        file:
          path: "{{ app_base_dir | default('/opt/apps') }}"
          state: directory
          mode: "0755"

      - name: Create service account group
        group:
          name: "{{ item }}"
          state: present
        loop: "{{ (service_accounts | default('app-web,app-worker')).split(',') }}"

      - name: Create service accounts
        user:
          name: "{{ item }}"
          group: "{{ item }}"
          home: "{{ app_base_dir | default('/opt/apps') }}/{{ item }}"
          shell: /usr/sbin/nologin
          system: yes
          create_home: yes
        loop: "{{ (service_accounts | default('app-web,app-worker')).split(',') }}"

      - name: Set home directory permissions
        file:
          path: "{{ app_base_dir | default('/opt/apps') }}/{{ item }}"
          owner: "{{ item }}"
          group: "{{ item }}"
          mode: "0750"
        loop: "{{ (service_accounts | default('app-web,app-worker')).split(',') }}"
