# Docker Install
# Installs Docker CE and Docker Compose plugin from the official Docker
# repository, then performs post-install configuration including adding
# the deploy user to the docker group.
#
# Customize:
#   - Set INVENTORY_GROUP to target hosts
#   - Set DOCKER_USER to the user that should run Docker commands

name: docker-install
description: Install Docker CE and Docker Compose with post-install configuration
tags: [containers, docker, docker-compose, linux, setup]
tool: ansible
cloud_provider: agnostic
os_family: debian
risk_level: low
compliance_tags: []

vars:
  INVENTORY_GROUP: "{{INVENTORY_GROUP}}"
  DOCKER_USER: "{{DOCKER_USER}}"

playbook: |
  ---
  - hosts: "{{ inventory_group }}"
    become: true
    tasks:
      - name: Install prerequisites
        apt:
          name:
            - ca-certificates
            - curl
            - gnupg
            - lsb-release
          state: present
          update_cache: yes

      - name: Add Docker GPG key
        apt_key:
          url: https://download.docker.com/linux/ubuntu/gpg
          state: present

      - name: Add Docker repository
        apt_repository:
          repo: "deb https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
          state: present

      - name: Install Docker CE
        apt:
          name:
            - docker-ce
            - docker-ce-cli
            - containerd.io
            - docker-compose-plugin
          state: present
          update_cache: yes

      - name: Add user to docker group
        user:
          name: "{{ docker_user | default('deploy') }}"
          groups: docker
          append: yes

      - name: Enable Docker service
        systemd:
          name: docker
          enabled: yes
          state: started

      - name: Verify Docker installation
        command: docker --version
        register: docker_version
        changed_when: false

      - name: Display Docker version
        debug:
          var: docker_version.stdout
