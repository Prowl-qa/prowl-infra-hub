name: Test AWS Connection

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Verify EC2 access
        run: |
          echo "Subnet: ${{ secrets.EC2_SUBNET_ID }}"
          echo "Security Group: ${{ secrets.EC2_SECURITY_GROUP_ID }}"
          echo "Key Pair: ${{ secrets.EC2_KEY_PAIR_NAME }}"
          aws ec2 describe-subnets --subnet-ids "${{ secrets.EC2_SUBNET_ID }}" --query 'Subnets[0].State' --output text
          aws ec2 describe-security-groups --group-ids "${{ secrets.EC2_SECURITY_GROUP_ID }}" --query 'SecurityGroups[0].GroupName' --output text
          aws ec2 describe-key-pairs --key-names "${{ secrets.EC2_KEY_PAIR_NAME }}" --query 'KeyPairs[0].KeyName' --output text

      - name: Verify SSH key format
        run: |
          trap 'rm -f /tmp/test-key.pem' EXIT
          # printf '%s\n' guarantees a trailing newline; GitHub Actions strips
          # trailing newlines from secrets when expanded via ${{ }}, and OpenSSH
          # rejects PEM files that don't end in a newline.
          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > /tmp/test-key.pem
          chmod 600 /tmp/test-key.pem

          if [ ! -s /tmp/test-key.pem ]; then
            echo "SSH key secret is empty" >&2
            exit 1
          fi

          if grep -q '\\n' /tmp/test-key.pem; then
            echo "SSH key secret contains escaped newline sequences; store it as a multiline private key" >&2
            exit 1
          fi

          if ssh-keygen -y -f /tmp/test-key.pem > /dev/null; then
            echo "SSH key is valid"
          else
            echo "SSH key is INVALID" >&2
            exit 1
          fi
