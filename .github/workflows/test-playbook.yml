name: Test Playbooks

on:
  pull_request:
    paths:
      - 'patching/**'
      - 'provisioning/**'
      - 'security/**'
      - 'monitoring/**'
      - 'containers/**'
      - 'networking/**'
      - 'backup/**'
      - 'configuration/**'
      - 'ci-cd/**'

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  test-changed-playbooks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Molecule and Docker driver
        run: pip install molecule molecule-plugins[docker]

      - name: Detect changed playbooks
        id: changed
        run: |
          FILES=$(gh pr diff ${{ github.event.pull_request.number }} --name-only | grep -E '^(patching|provisioning|security|monitoring|containers|networking|backup|configuration|ci-cd)/.+\.yml$' || true)
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          if [ -z "$FILES" ]; then
            echo "count=0" >> "$GITHUB_OUTPUT"
          else
            echo "count=$(echo "$FILES" | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run playbook tests
        if: steps.changed.outputs.count != '0'
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          EXIT_CODE=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            echo "::group::Testing $file"
            npx tsx cli/index.ts test "$file" --os ubuntu-22.04 || EXIT_CODE=1
            echo "::endgroup::"
          done <<< "$CHANGED_FILES"
          exit $EXIT_CODE

      - name: Upload test reports
        if: always() && steps.changed.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: playbook-test-reports
          path: .prowl-test-reports/
          if-no-files-found: ignore

      - name: Comment test results on PR
        if: always() && steps.changed.outputs.count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const core = require('@actions/core');
            const fs = require('fs');
            const path = require('path');
            const reportDir = '.prowl-test-reports';

            let reports = [];
            try {
              const files = fs.readdirSync(reportDir).filter(f => f.endsWith('.json'));
              reports = files.map(f => JSON.parse(fs.readFileSync(path.join(reportDir, f), 'utf8')));
            } catch {
              // No reports generated
            }

            if (reports.length === 0) return;

            const passed = reports.filter(r => r.passed).length;
            const failed = reports.filter(r => !r.passed).length;
            const icon = failed > 0 ? '🔴' : '🟢';

            let body = `## ${icon} Playbook Test Results\n\n`;
            body += `| Playbook | OS | Result | Duration |\n`;
            body += `|----------|-----|--------|----------|\n`;

            for (const r of reports) {
              const status = r.passed ? '✅ Passed' : '❌ Failed';
              const duration = r.duration_ms > 1000 ? `${(r.duration_ms / 1000).toFixed(1)}s` : `${r.duration_ms}ms`;
              body += `| \`${r.playbook}\` | ${r.testedOn.os} | ${status} | ${duration} |\n`;
            }

            body += `\n**${passed} passed, ${failed} failed** out of ${reports.length} tested\n`;
            body += `\n---\n*Generated by [prowl-infra test](../blob/main/cli/index.ts)*`;

            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            } catch (error) {
              const status = error?.status ?? error?.response?.status;
              if (status === 403) {
                core.warning(`Skipping PR comment because this workflow token cannot create issue comments for the current run: ${error.message}`);
                return;
              }
              throw error;
            }
