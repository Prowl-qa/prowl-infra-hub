name: Lint Workflows

# Catches GitHub Actions expression errors, missing permissions blocks,
# unquoted shell variables, and other bugs we hit repeatedly while debugging
# PQIH-001 / PQIH-016 (e.g., the EC2_SSH_PRIVATE_KEY trailing-newline issue,
# the YAML-scanner break from a JS template literal newline in create.yml).
# Runs actionlint, which invokes shellcheck on every `run:` block when
# shellcheck is on PATH.

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install shellcheck
        # apt-provided shellcheck is sufficient and gets picked up
        # automatically by actionlint when present.
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version | head -2

      - name: Install actionlint
        # Pin actionlint to a known-good release for reproducibility.
        # Bump deliberately when upstream ships a needed fix.
        env:
          ACTIONLINT_VERSION: '1.7.7'
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) \
            "$ACTIONLINT_VERSION"
          echo "$PWD" >> "$GITHUB_PATH"
          "$PWD/actionlint" -version

      - name: Run actionlint
        run: actionlint -color
