name: Test Playbooks (EC2)

on:
  workflow_dispatch:
    inputs:
      playbook_path:
        description: 'Specific playbook to test (leave empty for all)'
        required: false
        type: string
      environment:
        description: 'Environment profile (or "all" for full matrix)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - rhel8-legacy
          - rhel9-current
          - ubuntu-2204
          - ubuntu-2404
          - al2023
          - debian-12
  schedule:
    - cron: '0 3 * * 1'  # Weekly Monday 3 AM UTC

permissions:
  id-token: write
  contents: read

env:
  RUN_ID: ${{ github.run_id }}
  PROWL_EC2_RUN_ID: ${{ github.run_id }}

jobs:
  determine-matrix:
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.matrix.outputs.environments }}
    steps:
      - name: Build environment matrix
        id: matrix
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.environment }}" = "all" ] || [ -z "${{ inputs.environment }}" ]; then
            echo 'environments=["rhel8-legacy","rhel9-current","ubuntu-2204","ubuntu-2404","al2023","debian-12"]' >> "$GITHUB_OUTPUT"
          else
            echo 'environments=["${{ inputs.environment }}"]' >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: determine-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJson(needs.determine-matrix.outputs.environments) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Molecule and EC2 driver
        # We use Molecule's delegated driver with our own create.yml /
        # destroy.yml (generated by cli/drivers/ansible-ec2.ts) that call
        # amazon.aws EC2 modules directly. molecule-plugins[ec2] is no
        # longer needed and modern molecule-plugins releases dropped the
        # bundled EC2 driver playbooks anyway.
        run: |
          pip install \
            'molecule>=6,<7' \
            'ansible-core>=2.15,<2.18' \
            'boto3==1.34.131' \
            'botocore==1.34.131'
          ansible-galaxy collection install 'amazon.aws:==7.5.0' 'community.aws:==7.2.0'

      - name: Write SSH key
        run: |
          echo "$EC2_SSH_PRIVATE_KEY" > /tmp/prowl-ec2-key.pem
          chmod 600 /tmp/prowl-ec2-key.pem
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

      - name: Run EC2 playbook tests
        env:
          EC2_SUBNET_ID: ${{ secrets.EC2_SUBNET_ID }}
          EC2_SECURITY_GROUP_ID: ${{ secrets.EC2_SECURITY_GROUP_ID }}
          EC2_KEY_PAIR_NAME: ${{ secrets.EC2_KEY_PAIR_NAME }}
          EC2_SSH_PRIVATE_KEY_PATH: /tmp/prowl-ec2-key.pem
        run: |
          PLAYBOOK_ARG="${{ inputs.playbook_path }}"
          if [ -n "$PLAYBOOK_ARG" ]; then
            npx tsx cli/index.ts test "$PLAYBOOK_ARG" --driver ec2 --env "${{ matrix.env }}"
          else
            npx tsx cli/index.ts test --all --driver ec2 --env "${{ matrix.env }}"
          fi

      - name: Cleanup SSH key
        if: always()
        run: rm -f /tmp/prowl-ec2-key.pem

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ec2-reports-${{ matrix.env }}
          path: .prowl-test-reports/
          if-no-files-found: ignore

  cleanup:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terminate any leaked test instances
        run: |
          echo "Checking for leaked prowl-test spot requests..."
          SPOT_REQUEST_IDS=$(aws ec2 describe-spot-instance-requests \
            --filters "Name=tag:prowl-test,Values=true" "Name=tag:Project,Values=ec2-test-env" "Name=tag:RunId,Values=${{ env.RUN_ID }}" "Name=state,Values=open,active" \
            --query "SpotInstanceRequests[].SpotInstanceRequestId" \
            --output text 2>/dev/null || true)

          if [ -n "$SPOT_REQUEST_IDS" ] && [ "$SPOT_REQUEST_IDS" != "None" ]; then
            echo "Cancelling leaked spot requests: $SPOT_REQUEST_IDS"
            read -r -a SPOT_REQUEST_ID_ARGS <<< "$SPOT_REQUEST_IDS"
            aws ec2 cancel-spot-instance-requests --spot-instance-request-ids "${SPOT_REQUEST_ID_ARGS[@]}"
          else
            echo "No leaked spot requests found."
          fi

          echo "Checking for leaked prowl-test instances..."
          INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:prowl-test,Values=true" "Name=tag:Project,Values=ec2-test-env" "Name=tag:RunId,Values=${{ env.RUN_ID }}" "Name=instance-state-name,Values=running,pending" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text 2>/dev/null || true)

          if [ -n "$INSTANCE_IDS" ] && [ "$INSTANCE_IDS" != "None" ]; then
            echo "Terminating leaked instances: $INSTANCE_IDS"
            read -r -a INSTANCE_ID_ARGS <<< "$INSTANCE_IDS"
            aws ec2 terminate-instances --instance-ids "${INSTANCE_ID_ARGS[@]}"
          else
            echo "No leaked instances found."
          fi

  summary:
    needs: [test, cleanup]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download all test reports
        uses: actions/download-artifact@v4
        with:
          path: all-reports
          pattern: ec2-reports-*
          merge-multiple: true

      - name: Generate summary
        run: |
          {
            echo "## EC2 Playbook Test Results"
            echo ""
            echo "| Playbook | Environment | Result | Duration |"
            echo "|----------|-------------|--------|----------|"

            PASSED=0
            FAILED=0

            for report in all-reports/*.json; do
              [ -f "$report" ] || continue
              PLAYBOOK=$(jq -r '.playbook' "$report")
              ENV_LABEL=$(jq -r '.environment.label // .testedOn.os' "$report")
              RESULT=$(jq -r 'if .passed then "Passed" else "Failed" end' "$report")
              DURATION=$(jq -r '.duration_ms' "$report")

              if [ "$RESULT" = "Passed" ]; then
                ICON="✅"
                PASSED=$((PASSED + 1))
              else
                ICON="❌"
                FAILED=$((FAILED + 1))
              fi

              if [ "$DURATION" -gt 1000 ] 2>/dev/null; then
                DURATION_FMT="$(awk -v ms="$DURATION" 'BEGIN { printf "%.1fs", ms / 1000 }')"
              else
                DURATION_FMT="${DURATION}ms"
              fi

              echo "| \`${PLAYBOOK}\` | ${ENV_LABEL} | ${ICON} ${RESULT} | ${DURATION_FMT} |"
            done

            TOTAL=$((PASSED + FAILED))
            echo ""
            if [ "$TOTAL" -eq 0 ]; then
              echo "No test reports found."
            else
              echo "**${PASSED} passed, ${FAILED} failed** out of ${TOTAL} tests"
            fi
            echo ""
            echo "---"
            echo "*Generated by [prowl-infra test](../blob/main/cli/index.ts) with EC2 driver*"
          } >> "$GITHUB_STEP_SUMMARY"
