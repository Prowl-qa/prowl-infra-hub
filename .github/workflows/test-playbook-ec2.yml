name: Test Playbooks (EC2)

on:
  workflow_dispatch:
    inputs:
      playbook_path:
        description: 'Specific playbook to test (leave empty for all)'
        required: false
        type: string
      environment:
        description: 'Environment profile (or "all" for full matrix)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - rhel8-legacy
          - rhel9-current
          - ubuntu-2204
          - ubuntu-2404
          - al2023
          - debian-12
  schedule:
    - cron: '0 3 * * 1'  # Weekly Monday 3 AM UTC

permissions:
  id-token: write
  contents: read

jobs:
  determine-matrix:
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.matrix.outputs.environments }}
    steps:
      - name: Build environment matrix
        id: matrix
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.environment }}" = "all" ] || [ -z "${{ inputs.environment }}" ]; then
            echo 'environments=["rhel8-legacy","rhel9-current","ubuntu-2204","ubuntu-2404","al2023","debian-12"]' >> "$GITHUB_OUTPUT"
          else
            echo 'environments=["${{ inputs.environment }}"]' >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: determine-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJson(needs.determine-matrix.outputs.environments) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Molecule and EC2 driver
        run: pip install molecule molecule-plugins[ec2] boto3 botocore

      - name: Write SSH key
        run: |
          echo "$EC2_SSH_PRIVATE_KEY" > /tmp/prowl-ec2-key.pem
          chmod 600 /tmp/prowl-ec2-key.pem
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

      - name: Run EC2 playbook tests
        env:
          EC2_SUBNET_ID: ${{ secrets.EC2_SUBNET_ID }}
          EC2_SECURITY_GROUP_ID: ${{ secrets.EC2_SECURITY_GROUP_ID }}
          EC2_KEY_PAIR_NAME: ${{ secrets.EC2_KEY_PAIR_NAME }}
          EC2_SSH_PRIVATE_KEY_PATH: /tmp/prowl-ec2-key.pem
        run: |
          PLAYBOOK_ARG="${{ inputs.playbook_path }}"
          if [ -n "$PLAYBOOK_ARG" ]; then
            npx tsx cli/index.ts test "$PLAYBOOK_ARG" --driver ec2 --env "${{ matrix.env }}"
          else
            npx tsx cli/index.ts test --all --driver ec2 --env "${{ matrix.env }}"
          fi

      - name: Cleanup SSH key
        if: always()
        run: rm -f /tmp/prowl-ec2-key.pem

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ec2-reports-${{ matrix.env }}
          path: .prowl-test-reports/
          if-no-files-found: ignore

  cleanup:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terminate any leaked test instances
        run: |
          echo "Checking for leaked prowl-test instances..."
          INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:prowl-test,Values=true" "Name=instance-state-name,Values=running,pending" \
            --query "Reservations[].Instances[?LaunchTime<='$(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%S 2>/dev/null || date -u -v-30M +%Y-%m-%dT%H:%M:%S)'].InstanceId" \
            --output text 2>/dev/null || true)

          if [ -n "$INSTANCE_IDS" ] && [ "$INSTANCE_IDS" != "None" ]; then
            echo "Terminating leaked instances: $INSTANCE_IDS"
            aws ec2 terminate-instances --instance-ids $INSTANCE_IDS
          else
            echo "No leaked instances found."
          fi

  summary:
    needs: [test, cleanup]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download all test reports
        uses: actions/download-artifact@v4
        with:
          path: all-reports
          pattern: ec2-reports-*
          merge-multiple: true

      - name: Generate summary
        run: |
          echo "## EC2 Playbook Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Playbook | Environment | Result | Duration |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------------|--------|----------|" >> "$GITHUB_STEP_SUMMARY"

          PASSED=0
          FAILED=0

          for report in all-reports/*.json; do
            [ -f "$report" ] || continue
            PLAYBOOK=$(jq -r '.playbook' "$report")
            ENV_LABEL=$(jq -r '.environment.label // .testedOn.os' "$report")
            RESULT=$(jq -r 'if .passed then "Passed" else "Failed" end' "$report")
            DURATION=$(jq -r '.duration_ms' "$report")

            if [ "$RESULT" = "Passed" ]; then
              ICON="✅"
              PASSED=$((PASSED + 1))
            else
              ICON="❌"
              FAILED=$((FAILED + 1))
            fi

            if [ "$DURATION" -gt 1000 ] 2>/dev/null; then
              DURATION_FMT="$(echo "scale=1; $DURATION / 1000" | bc)s"
            else
              DURATION_FMT="${DURATION}ms"
            fi

            echo "| \`${PLAYBOOK}\` | ${ENV_LABEL} | ${ICON} ${RESULT} | ${DURATION_FMT} |" >> "$GITHUB_STEP_SUMMARY"
          done

          TOTAL=$((PASSED + FAILED))
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$TOTAL" -eq 0 ]; then
            echo "No test reports found." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**${PASSED} passed, ${FAILED} failed** out of ${TOTAL} tests" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "*Generated by [prowl-infra test](../blob/main/cli/index.ts) with EC2 driver*" >> "$GITHUB_STEP_SUMMARY"
