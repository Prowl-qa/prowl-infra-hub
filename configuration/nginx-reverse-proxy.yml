# Nginx Reverse Proxy
# Configures Nginx as a reverse proxy with SSL termination using Let's Encrypt
# certificates. Sets up upstream forwarding, security headers, and logging.
#
# Customize:
#   - Set INVENTORY_GROUP to target hosts
#   - Set DOMAIN_NAME to your application's domain
#   - Set UPSTREAM_HOST and UPSTREAM_PORT for the backend service
#   - Set CERT_EMAIL for Let's Encrypt certificate registration

name: nginx-reverse-proxy
description: Configure Nginx as a reverse proxy with SSL termination
tags: [configuration, nginx, reverse-proxy, ssl, letsencrypt, linux]
tool: ansible
cloud_provider: agnostic
os_family: debian
risk_level: medium
compliance_tags: []

vars:
  INVENTORY_GROUP: "{{INVENTORY_GROUP}}"
  DOMAIN_NAME: "{{DOMAIN_NAME}}"
  UPSTREAM_HOST: "{{UPSTREAM_HOST}}"
  UPSTREAM_PORT: "{{UPSTREAM_PORT}}"
  CERT_EMAIL: "{{CERT_EMAIL}}"

playbook: |
  ---
  - hosts: "{{ inventory_group }}"
    become: true
    vars:
      domain: "{{ domain_name }}"
      upstream: "{{ upstream_host | default('127.0.0.1') }}:{{ upstream_port | default(3000) }}"
    tasks:
      - name: Install Nginx and Certbot
        apt:
          name:
            - nginx
            - certbot
            - python3-certbot-nginx
          state: present
          update_cache: yes

      - name: Create Nginx site configuration
        copy:
          dest: "/etc/nginx/sites-available/{{ domain }}"
          content: |
            upstream app_backend {
                server {{ upstream }};
            }

            server {
                listen 80;
                server_name {{ domain }};

                location /.well-known/acme-challenge/ {
                    root /var/www/certbot;
                }

                location / {
                    return 301 https://$host$request_uri;
                }
            }

            server {
                listen 443 ssl http2;
                server_name {{ domain }};

                ssl_certificate /etc/letsencrypt/live/{{ domain }}/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/{{ domain }}/privkey.pem;

                ssl_protocols TLSv1.2 TLSv1.3;
                ssl_prefer_server_ciphers on;

                add_header X-Frame-Options DENY always;
                add_header X-Content-Type-Options nosniff always;
                add_header X-XSS-Protection "1; mode=block" always;
                add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

                location / {
                    proxy_pass http://app_backend;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }

                access_log /var/log/nginx/{{ domain }}.access.log;
                error_log /var/log/nginx/{{ domain }}.error.log;
            }
        notify: reload nginx

      - name: Enable site
        file:
          src: "/etc/nginx/sites-available/{{ domain }}"
          dest: "/etc/nginx/sites-enabled/{{ domain }}"
          state: link
        notify: reload nginx

      - name: Test Nginx configuration
        command: nginx -t
        changed_when: false

    handlers:
      - name: reload nginx
        systemd:
          name: nginx
          state: reloaded
