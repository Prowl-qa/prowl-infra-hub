# Environment Secrets Injection
# Manages application .env files with secrets sourced from Ansible Vault.
# Creates the application directory, templates the environment file with
# restricted permissions, and verifies the result.
#
# Customize:
#   - Set INVENTORY_GROUP to target hosts
#   - Set APP_DIR to the application's root directory
#   - Set ENV_FILE_OWNER and ENV_FILE_GROUP for file ownership

name: env-secrets-injection
description: Manage application .env files with secrets from Ansible Vault
tags: [configuration, secrets, env, vault, security]
tool: ansible
cloud_provider: agnostic
os_family: agnostic
risk_level: medium
compliance_tags: [SOC2]

vars:
  INVENTORY_GROUP: "{{INVENTORY_GROUP}}"
  APP_DIR: "{{APP_DIR}}"
  ENV_FILE_OWNER: "{{ENV_FILE_OWNER}}"
  ENV_FILE_GROUP: "{{ENV_FILE_GROUP}}"

playbook: |
  ---
  - hosts: "{{ inventory_group }}"
    become: true
    tasks:
      - name: Create application directory
        file:
          path: "{{ app_dir }}"
          state: directory
          owner: "{{ env_file_owner | default('root') }}"
          group: "{{ env_file_group | default('root') }}"
          mode: "0750"

      - name: Template environment file from vault secrets
        template:
          src: templates/env.j2
          dest: "{{ app_dir }}/.env"
          owner: "{{ env_file_owner | default('root') }}"
          group: "{{ env_file_group | default('root') }}"
          mode: "0600"
        no_log: true

      - name: Set strict permissions on env file
        file:
          path: "{{ app_dir }}/.env"
          owner: "{{ env_file_owner | default('root') }}"
          group: "{{ env_file_group | default('root') }}"
          mode: "0600"

      - name: Verify env file exists and has correct permissions
        stat:
          path: "{{ app_dir }}/.env"
        register: env_file_stat
        failed_when: >
          not env_file_stat.stat.exists or
          env_file_stat.stat.pw_name != (env_file_owner | default('root')) or
          env_file_stat.stat.mode != '0600'
