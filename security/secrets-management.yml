# Secrets Management
# Ansible playbook for installing and configuring HashiCorp Vault for
# centralized secrets management with file storage backend and audit logging.
#
# Customize:
#   - Set INVENTORY_GROUP to target the hosts that will run Vault
#   - Set VAULT_VERSION to the desired HashiCorp Vault release
#   - Set VAULT_ADDR to the Vault listener address
#   - Set VAULT_STORAGE_PATH to the directory for Vault's file storage backend

name: secrets-management
description: Install and configure HashiCorp Vault for centralized secrets management
tags: [security, vault, secrets, ansible, hardening]
tool: ansible
cloud_provider: agnostic
os_family: agnostic
risk_level: medium
compliance_tags: [SOC2, HIPAA, PCI-DSS]

vars:
  INVENTORY_GROUP: "{{INVENTORY_GROUP}}"
  VAULT_VERSION: "{{VAULT_VERSION}}"
  VAULT_ADDR: "{{VAULT_ADDR}}"
  VAULT_STORAGE_PATH: "{{VAULT_STORAGE_PATH}}"

playbook: |
  ---
  - hosts: "{{ inventory_group }}"
    become: true
    vars:
      vault_version: "{{ vault_version | default('1.15.4') }}"
      vault_addr: "{{ vault_addr | default('https://127.0.0.1:8200') }}"
      vault_storage_path: "{{ vault_storage_path | default('/opt/vault/data') }}"
      vault_config_dir: "/etc/vault.d"
      vault_user: "vault"
      vault_group: "vault"

    tasks:
      - name: Create vault system user and group
        block:
          - name: Create vault group
            group:
              name: "{{ vault_group }}"
              system: yes
              state: present

          - name: Create vault user
            user:
              name: "{{ vault_user }}"
              group: "{{ vault_group }}"
              system: yes
              shell: /usr/sbin/nologin
              home: "/opt/vault"
              create_home: no

      - name: Install HashiCorp Vault
        block:
          - name: Install prerequisite packages
            package:
              name:
                - unzip
                - curl
                - jq
              state: present

          - name: Download Vault binary
            get_url:
              url: "https://releases.hashicorp.com/vault/{{ vault_version }}/vault_{{ vault_version }}_linux_amd64.zip"
              dest: "/tmp/vault_{{ vault_version }}.zip"
              mode: "0644"
              checksum: "sha256:https://releases.hashicorp.com/vault/{{ vault_version }}/vault_{{ vault_version }}_SHA256SUMS"

          - name: Unzip Vault binary
            unarchive:
              src: "/tmp/vault_{{ vault_version }}.zip"
              dest: /usr/local/bin
              remote_src: yes
              mode: "0755"

          - name: Verify Vault installation
            command: vault --version
            register: vault_version_output
            changed_when: false

      - name: Create Vault configuration
        block:
          - name: Create config directory
            file:
              path: "{{ vault_config_dir }}"
              state: directory
              owner: "{{ vault_user }}"
              group: "{{ vault_group }}"
              mode: "0750"

          - name: Create storage directory
            file:
              path: "{{ vault_storage_path }}"
              state: directory
              owner: "{{ vault_user }}"
              group: "{{ vault_group }}"
              mode: "0750"

          - name: Create audit log directory
            file:
              path: "/var/log/vault"
              state: directory
              owner: "{{ vault_user }}"
              group: "{{ vault_group }}"
              mode: "0750"

          - name: Write Vault server configuration
            copy:
              dest: "{{ vault_config_dir }}/vault.hcl"
              owner: "{{ vault_user }}"
              group: "{{ vault_group }}"
              mode: "0640"
              content: |
                ui = true
                disable_mlock = false

                storage "file" {
                  path = "{{ vault_storage_path }}"
                }

                listener "tcp" {
                  address       = "0.0.0.0:8200"
                  tls_disable   = false
                  tls_cert_file = "{{ vault_config_dir }}/tls/tls.crt"
                  tls_key_file  = "{{ vault_config_dir }}/tls/tls.key"
                }

                api_addr     = "{{ vault_addr }}"
                cluster_addr = "https://{{ ansible_default_ipv4.address }}:8201"

                max_lease_ttl     = "768h"
                default_lease_ttl = "768h"
            notify: Restart vault

      - name: Create Vault systemd service
        copy:
          dest: /etc/systemd/system/vault.service
          mode: "0644"
          content: |
            [Unit]
            Description=HashiCorp Vault
            Documentation=https://www.vaultproject.io/docs
            Requires=network-online.target
            After=network-online.target
            ConditionFileNotEmpty={{ vault_config_dir }}/vault.hcl
            StartLimitIntervalSec=60
            StartLimitBurst=3

            [Service]
            User={{ vault_user }}
            Group={{ vault_group }}
            ProtectSystem=full
            ProtectHome=read-only
            PrivateTmp=yes
            PrivateDevices=yes
            SecureBits=keep-caps
            AmbientCapabilities=CAP_IPC_LOCK
            NoNewPrivileges=yes
            ExecStart=/usr/local/bin/vault server -config={{ vault_config_dir }}/vault.hcl
            ExecReload=/bin/kill --signal HUP $MAINPID
            KillMode=process
            KillSignal=SIGINT
            Restart=on-failure
            RestartSec=5
            TimeoutStopSec=30
            LimitNOFILE=65536
            LimitMEMLOCK=infinity

            [Install]
            WantedBy=multi-user.target
        notify: Restart vault

      - name: Initialize Vault and enable audit logging
        block:
          - name: Enable and start Vault service
            systemd:
              name: vault
              enabled: yes
              state: started
              daemon_reload: yes

          - name: Wait for Vault to be ready
            uri:
              url: "{{ vault_addr }}/v1/sys/health"
              method: GET
              status_code: [200, 429, 472, 473, 501]
              validate_certs: no
            register: vault_health
            retries: 10
            delay: 5
            until: vault_health.status is defined

          - name: Check if Vault is already initialized
            uri:
              url: "{{ vault_addr }}/v1/sys/init"
              method: GET
              validate_certs: no
            register: vault_init_status

          - name: Initialize Vault
            uri:
              url: "{{ vault_addr }}/v1/sys/init"
              method: PUT
              body_format: json
              body:
                secret_shares: 5
                secret_threshold: 3
              validate_certs: no
            register: vault_init_result
            when: not vault_init_status.json.initialized

          - name: Save Vault init keys securely
            copy:
              content: "{{ vault_init_result.json | to_nice_json }}"
              dest: "/root/.vault-init-keys.json"
              mode: "0600"
              owner: root
              group: root
            when: vault_init_result is changed
            no_log: true

      - name: Enable audit logging
        block:
          - name: Set VAULT_ADDR environment variable
            lineinfile:
              path: /etc/environment
              line: "VAULT_ADDR={{ vault_addr }}"
              regexp: "^VAULT_ADDR="

          - name: Enable file audit device
            command: >
              vault audit enable file
              file_path=/var/log/vault/audit.log
            environment:
              VAULT_ADDR: "{{ vault_addr }}"
              VAULT_TOKEN: "{{ vault_init_result.json.root_token | default(omit) }}"
            when: vault_init_result is changed
            no_log: true

    handlers:
      - name: Restart vault
        systemd:
          name: vault
          state: restarted
          daemon_reload: yes
