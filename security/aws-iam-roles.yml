# AWS IAM Roles
# Terraform configuration for creating IAM roles with least-privilege policies,
# following the principle of minimal permissions for each service role.
#
# Customize:
#   - Set AWS_REGION to your target AWS region
#   - Set PROJECT_NAME to identify the project for resource naming
#   - Set ENVIRONMENT to the deployment stage (dev, staging, prod)

name: aws-iam-roles
description: Create AWS IAM roles with least-privilege policies for service access
tags: [security, aws, iam, terraform, least-privilege]
tool: terraform
cloud_provider: aws
os_family: agnostic
risk_level: medium
compliance_tags: [SOC2, CIS]

vars:
  AWS_REGION: "{{AWS_REGION}}"
  PROJECT_NAME: "{{PROJECT_NAME}}"
  ENVIRONMENT: "{{ENVIRONMENT}}"

playbook: |
  ---
  provider "aws" {
    region = var.aws_region
  }

  variable "aws_region" {
    description = "AWS region for IAM resources"
    type        = string
    default     = "us-east-1"
  }

  variable "project_name" {
    description = "Project name for resource naming"
    type        = string
  }

  variable "environment" {
    description = "Deployment environment (dev, staging, prod)"
    type        = string
    default     = "dev"
  }

  data "aws_caller_identity" "current" {}

  # Application role - limited to S3 and CloudWatch access
  resource "aws_iam_role" "application" {
    name = "${var.project_name}-${var.environment}-app-role"

    assume_role_policy = jsonencode({
      Version = "2012-10-17"
      Statement = [
        {
          Action = "sts:AssumeRole"
          Effect = "Allow"
          Principal = {
            Service = "ec2.amazonaws.com"
          }
          Condition = {
            StringEquals = {
              "aws:RequestedRegion" = var.aws_region
            }
          }
        }
      ]
    })

    tags = {
      Name        = "${var.project_name}-app-role"
      Environment = var.environment
      ManagedBy   = "terraform"
    }
  }

  resource "aws_iam_policy" "app_s3_read" {
    name        = "${var.project_name}-${var.environment}-s3-read"
    description = "Read-only access to project S3 buckets"

    policy = jsonencode({
      Version = "2012-10-17"
      Statement = [
        {
          Sid    = "S3ReadAccess"
          Effect = "Allow"
          Action = [
            "s3:GetObject",
            "s3:ListBucket",
            "s3:GetBucketLocation"
          ]
          Resource = [
            "arn:aws:s3:::${var.project_name}-${var.environment}-*",
            "arn:aws:s3:::${var.project_name}-${var.environment}-*/*"
          ]
        }
      ]
    })

    tags = {
      Environment = var.environment
      ManagedBy   = "terraform"
    }
  }

  resource "aws_iam_policy" "app_cloudwatch" {
    name        = "${var.project_name}-${var.environment}-cloudwatch"
    description = "CloudWatch logging and metrics access"

    policy = jsonencode({
      Version = "2012-10-17"
      Statement = [
        {
          Sid    = "CloudWatchLogs"
          Effect = "Allow"
          Action = [
            "logs:CreateLogGroup",
            "logs:CreateLogStream",
            "logs:PutLogEvents",
            "logs:DescribeLogGroups",
            "logs:DescribeLogStreams"
          ]
          Resource = "arn:aws:logs:${var.aws_region}:${data.aws_caller_identity.current.account_id}:log-group:/aws/${var.project_name}/*"
        },
        {
          Sid    = "CloudWatchMetrics"
          Effect = "Allow"
          Action = [
            "cloudwatch:PutMetricData",
            "cloudwatch:GetMetricData"
          ]
          Resource = "*"
          Condition = {
            StringEquals = {
              "cloudwatch:namespace" = var.project_name
            }
          }
        }
      ]
    })

    tags = {
      Environment = var.environment
      ManagedBy   = "terraform"
    }
  }

  resource "aws_iam_role_policy_attachment" "app_s3" {
    role       = aws_iam_role.application.name
    policy_arn = aws_iam_policy.app_s3_read.arn
  }

  resource "aws_iam_role_policy_attachment" "app_cloudwatch" {
    role       = aws_iam_role.application.name
    policy_arn = aws_iam_policy.app_cloudwatch.arn
  }

  # Deny policy to prevent privilege escalation
  resource "aws_iam_policy" "deny_escalation" {
    name        = "${var.project_name}-${var.environment}-deny-escalation"
    description = "Prevent IAM privilege escalation"

    policy = jsonencode({
      Version = "2012-10-17"
      Statement = [
        {
          Sid    = "DenyPrivilegeEscalation"
          Effect = "Deny"
          Action = [
            "iam:CreateUser",
            "iam:CreateRole",
            "iam:AttachUserPolicy",
            "iam:AttachRolePolicy",
            "iam:PutUserPolicy",
            "iam:PutRolePolicy",
            "iam:AddUserToGroup",
            "iam:UpdateAssumeRolePolicy"
          ]
          Resource = "*"
        }
      ]
    })

    tags = {
      Environment = var.environment
      ManagedBy   = "terraform"
    }
  }

  resource "aws_iam_role_policy_attachment" "deny_escalation" {
    role       = aws_iam_role.application.name
    policy_arn = aws_iam_policy.deny_escalation.arn
  }

  output "application_role_arn" {
    description = "ARN of the application IAM role"
    value       = aws_iam_role.application.arn
  }
