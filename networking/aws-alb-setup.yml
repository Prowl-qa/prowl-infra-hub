# AWS ALB Setup
# Provisions an AWS Application Load Balancer with target groups and
# listeners for HTTP and HTTPS traffic. Includes health checks and
# SSL termination via ACM certificate.
#
# Customize:
#   - Set AWS_REGION to your target AWS region
#   - Set VPC_ID to the VPC where the ALB will be created
#   - Set SUBNET_IDS as a comma-separated list of public subnet IDs
#   - Set PROJECT_NAME to prefix resource names
#   - Set CERTIFICATE_ARN to the ACM certificate for HTTPS

name: aws-alb-setup
description: Provision an AWS Application Load Balancer with target groups and listeners
tags: [networking, aws, alb, load-balancer, terraform]
tool: terraform
cloud_provider: aws
os_family: agnostic
risk_level: medium
compliance_tags: []

vars:
  AWS_REGION: "{{AWS_REGION}}"
  VPC_ID: "{{VPC_ID}}"
  SUBNET_IDS: "{{SUBNET_IDS}}"
  PROJECT_NAME: "{{PROJECT_NAME}}"
  CERTIFICATE_ARN: "{{CERTIFICATE_ARN}}"

playbook: |
  provider "aws" {
    region = var.aws_region
  }

  variable "aws_region" {
    description = "AWS region for the ALB"
    type        = string
    default     = "us-east-1"
  }

  variable "vpc_id" {
    description = "VPC ID where the ALB will be created"
    type        = string
  }

  variable "subnet_ids" {
    description = "List of public subnet IDs for the ALB"
    type        = list(string)
  }

  variable "project_name" {
    description = "Project name used to prefix resources"
    type        = string
  }

  variable "certificate_arn" {
    description = "ACM certificate ARN for HTTPS listener"
    type        = string
  }

  resource "aws_lb" "main" {
    name               = "${var.project_name}-alb"
    internal           = false
    load_balancer_type = "application"
    security_groups    = [aws_security_group.alb.id]
    subnets            = var.subnet_ids

    enable_deletion_protection = false

    tags = {
      Name    = "${var.project_name}-alb"
      Project = var.project_name
    }
  }

  resource "aws_security_group" "alb" {
    name        = "${var.project_name}-alb-sg"
    description = "Security group for ALB"
    vpc_id      = var.vpc_id

    ingress {
      description = "HTTP"
      from_port   = 80
      to_port     = 80
      protocol    = "tcp"
      cidr_blocks = ["0.0.0.0/0"]
    }

    ingress {
      description = "HTTPS"
      from_port   = 443
      to_port     = 443
      protocol    = "tcp"
      cidr_blocks = ["0.0.0.0/0"]
    }

    egress {
      from_port   = 0
      to_port     = 0
      protocol    = "-1"
      cidr_blocks = ["0.0.0.0/0"]
    }

    tags = {
      Name    = "${var.project_name}-alb-sg"
      Project = var.project_name
    }
  }

  resource "aws_lb_target_group" "main" {
    name     = "${var.project_name}-tg"
    port     = 80
    protocol = "HTTP"
    vpc_id   = var.vpc_id

    health_check {
      enabled             = true
      healthy_threshold   = 3
      unhealthy_threshold = 3
      timeout             = 5
      interval            = 30
      path                = "/"
      matcher             = "200"
    }

    tags = {
      Name    = "${var.project_name}-tg"
      Project = var.project_name
    }
  }

  resource "aws_lb_listener" "http" {
    load_balancer_arn = aws_lb.main.arn
    port              = 80
    protocol          = "HTTP"

    default_action {
      type = "redirect"

      redirect {
        port        = "443"
        protocol    = "HTTPS"
        status_code = "HTTP_301"
      }
    }
  }

  resource "aws_lb_listener" "https" {
    load_balancer_arn = aws_lb.main.arn
    port              = 443
    protocol          = "HTTPS"
    ssl_policy        = "ELBSecurityPolicy-TLS13-1-2-2021-06"
    certificate_arn   = var.certificate_arn

    default_action {
      type             = "forward"
      target_group_arn = aws_lb_target_group.main.arn
    }
  }

  output "alb_dns_name" {
    description = "DNS name of the ALB"
    value       = aws_lb.main.dns_name
  }

  output "alb_arn" {
    description = "ARN of the ALB"
    value       = aws_lb.main.arn
  }

  output "target_group_arn" {
    description = "ARN of the target group"
    value       = aws_lb_target_group.main.arn
  }
